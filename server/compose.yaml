services:
  baroconvert:
    build:
      context: .
      network: host
    container_name: baroconvert
    restart: unless-stopped
    environment:
      API_KEY: "${API_KEY:?Set API_KEY in server/.env}"
      CLOUDCONVERT_API_KEY: "${CLOUDCONVERT_API_KEY:-}"
      CLOUDCONVERT_TIMEOUT_SECONDS: "240"
      PDF_SERVICES_CLIENT_ID: "${PDF_SERVICES_CLIENT_ID:-}"
      PDF_SERVICES_CLIENT_SECRET: "${PDF_SERVICES_CLIENT_SECRET:-}"
      ADOBE_TIMEOUT_SECONDS: "240"
      MAX_UPLOAD_MB: "500"
      APP_VERSION_CODE: "14"
      APP_VERSION_NAME: "0.7.2"
      RELEASE_APK: "/app/releases/baroconvert.apk"
    ports:
      - "8787:8787"
    mem_limit: 2g
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./releases:/app/releases:ro
    tmpfs:
      - /tmp:size=4g,mode=1777
